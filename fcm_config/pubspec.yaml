name: fcm_config_new
description: This flutter package is made to merge between firebase_messaging package and flutter_local_notifications
version: 1.0.1

homepage: https://github.com/inossan-dev/fcm_config
repository: https://github.com/inossan-dev/fcm_config

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: '>=22.0.0 <25.0.0'
  plugin_platform_interface: ^2.1.8
  http: ^1.2.2
  web: ^1.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0

false_secrets:
  - /example/android/app/google-services.json
  - /example/ios/Runner/GoogleService-Info.plist
  - /example/web/firebase-messaging-sw.js
  - /example/lib/firebase_options.dart
  - /example/web/index.html
